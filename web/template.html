<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#63BEFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A2457" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <!--HEAD-->
  <link rel="icon" type="image/png" href="{{BASE}}favicon.png">
  <link rel="apple-touch-icon" href="{{BASE}}apple-touch-icon.png">
  <link rel="manifest" href="{{BASE}}manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{BASE}}app.min.css?v=1d41542a24">
  <script>try{var s=JSON.parse(localStorage.getItem('state_v1')||'{}');var l=(s.langChosen&&s.lang)||(new URLSearchParams(location.search).get('lang'))||(navigator.language||'en').slice(0,2);if(l==='iw')l='he';if(l==='he'||l==='ar'){document.documentElement.dir='rtl';document.documentElement.lang=l;}}catch(e){}</script>
  <!--CONFIG-->
</head>
<body>
  <div class="status-scrim" aria-hidden="true"></div>

  <main id="view-compare" class="view" data-view="compare">
    <header class="masthead">
      <div class="masthead-row">
        <!--BRAND-->
        <div class="masthead-actions">
        <label class="icon-btn lang-btn" data-i18n-aria="language">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 12h17M12 3.5c2.6 2.6 3.6 5.4 3.6 8.5s-1 5.9-3.6 8.5M12 3.5C9.4 6.1 8.4 8.9 8.4 12s1 5.9 3.6 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="lang-code" id="lang-code" aria-hidden="true"></span>
          <select id="lang-select" data-i18n-aria="language"></select>
        </label>
        <button class="icon-btn" id="refresh-btn" type="button" data-i18n-aria="refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="settings" data-i18n-aria="tabSettings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        </div>
      </div>
      <p class="data-status" id="data-status"></p>
      <div class="ptr" id="ptr" aria-hidden="true"></div>
    </header>

    <div class="toolbar" id="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="search-clear" id="search-clear" hidden data-i18n-aria="clear">×</button>
      </label>
      <div class="chips" id="chips" role="tablist"></div>
      <div class="filters">
        <label class="select">
          <span class="select-label" data-i18n="sortBy"></span>
          <select id="sort"></select>
        </label>
        <button type="button" class="toggle" id="f-npcsells" aria-pressed="false" data-i18n="filterNpcSells"></button>
        <button type="button" class="toggle" id="f-npcbuys" aria-pressed="false" data-i18n="filterNpcBuys"></button>
      </div>
    </div>

<!--SEO-->
    <div class="banner" id="banner" hidden></div>
    <ol class="rows" id="list"></ol>
    <div class="empty" id="empty" hidden></div>
    <div class="sentinel" id="sentinel"></div>
    <p class="credit" id="credit"></p>
  </main>

  <main id="view-market" class="view" data-view="market" hidden>
    <header class="masthead masthead-small">
      <h1 class="app-title" data-i18n="tabMarket"></h1>
      <p class="data-status" data-i18n="marketIntro"></p>
    </header>
    <div id="market" class="panels"></div>
  </main>

  <main id="view-tools" class="view" data-view="tools" hidden>
    <header class="masthead masthead-small">
      <h1 class="app-title" data-i18n="tabTools"></h1>
      <p class="data-status" data-i18n="toolsIntro"></p>
    </header>
    <div id="tools" class="panels"></div>
    <datalist id="item-names"></datalist>
  </main>

  <main id="view-shops" class="view" data-view="shops" hidden>
    <header class="masthead masthead-small">
      <h1 class="app-title" data-i18n="tabShops"></h1>
      <p class="data-status" data-i18n="shopsIntro"></p>
    </header>
    <div id="shops-map"></div>
    <div id="shops"></div>
  </main>

  <main id="view-saved" class="view" data-view="saved" hidden>
    <header class="masthead masthead-small">
      <h1 class="app-title" data-i18n="tabMe"></h1>
    </header>
    <ol class="rows" id="saved-list"></ol>
    <div class="empty" id="saved-empty" hidden></div>
    <section class="section" id="checks-section" hidden>
      <h2 class="section-title" data-i18n="myChecks"></h2>
      <ol class="plain-list" id="checks-list"></ol>
    </section>
  </main>

  <main id="view-settings" class="view" data-view="settings" hidden>
    <header class="masthead masthead-small">
      <h1 class="app-title" data-i18n="tabSettings"></h1>
    </header>
    <div id="settings"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button type="button" class="tab" data-tab="compare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h16M4 17h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span data-i18n="tabCompare"></span>
    </button>
    <button type="button" class="tab" data-tab="market">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m4.5 15 4.5-5 4 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 6H19v3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="tabMarket"></span>
    </button>
    <button type="button" class="tab" data-tab="tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 7.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/><circle cx="9" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/><circle cx="15" cy="16" r="1.2" fill="currentColor"/></svg>
      <span data-i18n="tabTools"></span>
    </button>
    <button type="button" class="tab" data-tab="shops">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5-4h-13L4 9Zm1 0v10h14V9M9.5 19v-5h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span data-i18n="tabShops"></span>
    </button>
    <button type="button" class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8L12 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span data-i18n="tabMe"></span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grab" id="sheet-grab"><span></span></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="{{BASE}}app.min.js?v=1d41542a24"></script>
</body>
</html>
