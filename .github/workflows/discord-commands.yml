# Registers the MapleCharts Discord bot's /price command. Run it once by hand after creating the Discord application.
# The application ID comes from site.config.json (discordAppId). Needs ONE of these secrets:
#   DISCORD_CLIENT_SECRET (the same OAuth2 client secret used for "Sign in with Discord"), or
#   DISCORD_BOT_TOKEN.
name: Discord commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Register /price
        env:
          APP_ID: ${{ secrets.DISCORD_APP_ID }}
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          if [ -z "$APP_ID" ]; then APP_ID=$(python3 -c "import json; print(json.load(open('site.config.json')).get('discordAppId',''))"); fi
          if [ -z "$APP_ID" ]; then echo "Set discordAppId in site.config.json first."; exit 1; fi
          if [ -n "$TOKEN" ]; then
            AUTH="Bot ${TOKEN}"
          elif [ -n "$CLIENT_SECRET" ]; then
            ACCESS=$(curl -fsS -u "${APP_ID}:${CLIENT_SECRET}" -d grant_type=client_credentials -d scope=applications.commands.update \
              https://discord.com/api/v10/oauth2/token | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
            echo "::add-mask::${ACCESS}"
            AUTH="Bearer ${ACCESS}"
          else
            echo "Add the DISCORD_CLIENT_SECRET (or DISCORD_BOT_TOKEN) secret first."; exit 1
          fi
          curl -fsS -X PUT "https://discord.com/api/v10/applications/${APP_ID}/commands" \
            -H "Authorization: ${AUTH}" -H "Content-Type: application/json" \
            -d '[{"name":"price","type":1,"description":"MapleStory Classic World price: players vs NPC shops","integration_types":[0,1],"contexts":[0,1,2],"options":[{"name":"item","description":"Item name","type":3,"required":true,"autocomplete":true}]}]' \
            | python3 -c "import json,sys; print('Registered:', [c['name'] for c in json.load(sys.stdin)])"
