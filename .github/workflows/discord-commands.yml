# Registers the MapleCharts Discord bot's /price command. Run it once by hand after creating the Discord application.
# Needs the variable DISCORD_APP_ID and the secret DISCORD_BOT_TOKEN.
name: Discord commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register /price
        env:
          APP_ID: ${{ vars.DISCORD_APP_ID }}
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$TOKEN" ]; then echo "Set DISCORD_APP_ID and DISCORD_BOT_TOKEN first."; exit 1; fi
          curl -fsS -X PUT "https://discord.com/api/v10/applications/${APP_ID}/commands" \
            -H "Authorization: Bot ${TOKEN}" -H "Content-Type: application/json" \
            -d '[{"name":"price","type":1,"description":"MapleStory Classic World price: players vs NPC shops","options":[{"name":"item","description":"Item name","type":3,"required":true,"autocomplete":true}]}]' \
            | python3 -c "import json,sys; print('Registered:', [c['name'] for c in json.load(sys.stdin)])"
