# Refreshes the game data MapleCharts uses from MapleClassic Wiki (CC BY-NC-SA 4.0):
# NPC sell prices, potion recovery, scroll success rates, crafting recipes and monster drops.
name: Wiki data

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wiki-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect from the wiki
        run: node tools/wiki_extract.mjs data/wiki.json
      - name: Save if anything changed
        run: |
          if git diff --quiet -- data/wiki.json 2>/dev/null && git ls-files --error-unmatch data/wiki.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git add data/wiki.json
          git -c user.name="maplecharts-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Wiki data $(date -u +%Y-%m-%d)"
          git push -q
          GH_TOKEN="${{ github.token }}" gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
